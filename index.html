<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ProgressPath" />
    <link rel="icon" type="image/svg+xml" href="/system_logo.svg" />
    <!-- <link rel="icon" type="image/x-icon" href="/favicon.ico" /> -->
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Progress Path</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme_preference') || 'system';
          var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Full-stack LMS platform with secure Admin Roles & Access Control, Audit Logs, Subjects & Lectures, Coding Repository, Academic Calendar, User Profile, and System Performance Benchmarks." />
    <meta property="og:title" content="Progress Path" />
    <meta property="og:description" content="Full-stack LMS platform with secure Admin Roles & Access Control, Audit Logs, Subjects & Lectures, Coding Repository, Academic Calendar, User Profile, and System Performance Benchmarks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Performance Preconnections for YouTube & Fast Video Streaming -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="preconnect" href="https://img.youtube.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://img.youtube.com" />
  </head>
  <body>
    <div id="root">
      <div id="pwa-prelaunch-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--splash-bg,#ffffff);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;transition:background-color 0.2s ease;">
        <style>
          :root { --splash-bg: #ffffff; --splash-text: #0f172a; --splash-sub: #64748b; --splash-card-bg: #ffffff; --splash-card-border: #e2e8f0; --splash-track: #f1f5f9; }
          html.dark { --splash-bg: #000000; --splash-text: #ffffff; --splash-sub: #94a3b8; --splash-card-bg: #09090b; --splash-card-border: #27272a; --splash-track: #18181b; }
          @keyframes pwaFloat { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-6px) scale(1.02)} }
          @keyframes pwaShimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(150%)} }
          .pwa-splash-logo { width:88px; height:88px; border-radius:20px; background:var(--splash-card-bg); border:1px solid var(--splash-card-border); box-shadow:0 10px 25px -5px rgba(0,0,0,0.08); display:flex; align-items:center; justify-content:center; animation:pwaFloat 3.2s ease-in-out infinite; }
          .pwa-track { position:relative; width:190px; height:5px; background:var(--splash-track); border-radius:999px; overflow:hidden; margin-top:22px; }
          .pwa-beam { position:absolute; inset:0; width:100px; background:linear-gradient(90deg,transparent,#2563eb,transparent); border-radius:999px; animation:pwaShimmer 1.8s cubic-bezier(0.4,0,0.2,1) infinite; }
        </style>
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;max-width:320px;padding:20px;">
          <div class="pwa-splash-logo">
            <img src="/system_logo.svg" alt="ProgressPath" style="width:58px;height:58px;object-fit:contain;pointer-events:none;" />
          </div>
          <div style="margin-top:20px;">
            <div style="font-size:22px;font-weight:800;letter-spacing:-0.025em;color:var(--splash-text);">ProgressPath</div>
            <div style="font-size:12px;font-weight:500;color:var(--splash-sub);margin-top:4px;">Study &amp; Coding Tracker</div>
          </div>
          <div class="pwa-track">
            <div class="pwa-beam"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

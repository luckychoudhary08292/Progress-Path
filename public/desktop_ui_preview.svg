  <!-- Code syntax lines -->
  <text x="76" y="282" fill="#8B949E" font-size="14" font-family="monospace">// Overlapping subproblems memoization: O(N) Time | O(N) Auxiliary Space</text>
  <text x="76" y="306" fill="#FF7B72" font-size="14" font-family="monospace">int <tspan fill="#D2A8FF">solve</tspan>(<tspan fill="#FFA657">int</tspan> n, vector&lt;<tspan fill="#FFA657">int</tspan>&gt;&amp; <tspan fill="#79C0FF">memo</tspan>) {</text>
  <text x="100" y="330" fill="#FF7B72" font-size="14" font-family="monospace">    if <tspan fill="#E6EDF3">(n &lt;= 1) </tspan><tspan fill="#FF7B72">return</tspan> n;</text>
  <text x="100" y="354" fill="#FF7B72" font-size="14" font-family="monospace">    if <tspan fill="#E6EDF3">(memo[n] != -1) </tspan><tspan fill="#FF7B72">return</tspan> memo[n]; <tspan fill="#8B949E">// Cache hit: O(1) return</tspan></text>
  <text x="100" y="378" fill="#FF7B72" font-size="14" font-family="monospace">    return <tspan fill="#79C0FF">memo[n]</tspan> = <tspan fill="#D2A8FF">solve</tspan>(n - 1, memo) + <tspan fill="#D2A8FF">solve</tspan>(n - 2, memo);</text>
  <text x="76" y="402" fill="#E6EDF3" font-size="14" font-family="monospace">}</text>


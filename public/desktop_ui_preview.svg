  <text x="68" y="774" fill="#CBD5E1" font-size="13">• Optimal Substructure: Solution to the main problem is recursively built from subproblems.</text>
  <text x="68" y="798" fill="#CBD5E1" font-size="13">• Overlapping Subproblems: Solved multiple times in naive tree; memo array caches them in O(1).</text>

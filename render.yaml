services:
  - type: web
    name: progresspath-platform
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_USERS
        value: "500"
      - key: MAX_SUBJECTS_PER_USER
        value: "50"
      - key: MAX_LECTURES_PER_SUBJECT
        value: "500"
      - key: MAX_PROBLEMS_PER_USER
        value: "1000"
      - key: MAX_EVENTS_PER_USER
        value: "1000"
      - key: MAX_EVENTS_PER_DAY
        value: "50"
      - key: MAX_NOTIFICATIONS_PER_USER
        value: "100"
      - key: MAX_FEEDBACK_PER_USER
        value: "50"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: AUTH_LOCKOUT_THRESHOLD
        value: "5"
      - key: USER_API_RATE_LIMIT_PER_MIN
        value: "240"
